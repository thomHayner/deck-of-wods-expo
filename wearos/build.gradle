apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdk 34
    namespace 'com.deckofwods.wear'

    defaultConfig {
        applicationId 'com.deckofwods.app.wear'
        minSdk 26  // Wear OS 2.0+
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.3'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Wear Compose UI
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'
    implementation 'androidx.wear.compose:compose-navigation:1.3.1'

    // Standard Compose (VerticalPager, etc.)
    implementation 'androidx.compose.foundation:foundation:1.6.7'
    implementation 'androidx.compose.ui:ui:1.6.7'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Wearable Data Layer (phone ↔ watch messaging)
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // Health Services (live heart rate, calories on the watch)
    implementation 'androidx.health.services.client:health-services-client:1.1.0-alpha03'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // Splash screen
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
